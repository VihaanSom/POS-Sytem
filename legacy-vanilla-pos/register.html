<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DashPoint - Sign Up</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="logo-link">
                    <img src="assets/logo.png" alt="DashPoint Logo" onerror="this.src='https://via.placeholder.com/40x40/2563eb/ffffff?text=DP'">
                    <span>DashPoint</span>
                </a>
                <h2>Create an Account</h2>
                <p>Start your free trial today. No credit card required.</p>
            </div>
            
            <form action="dashboard.html" method="GET" class="auth-form" id="register-form" novalidate>
                <div class="input-group">
                    <label for="name">Full Name</label>
                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        placeholder="John Doe" 
                        required 
                        minlength="2"
                        maxlength="50"
                        pattern="^[a-zA-Z\s'-]+$"
                        autocomplete="name"
                        aria-describedby="name-error">
                    <div class="error-feedback" id="name-error"></div>
                </div>
                <div class="input-group">
                    <label for="email">Email address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="name@company.com" 
                        required 
                        autocomplete="email"
                        aria-describedby="email-error">
                    <div class="error-feedback" id="email-error"></div>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Min 8 characters with letters & numbers" 
                        required 
                        minlength="8"
                        autocomplete="new-password"
                        aria-describedby="password-error">
                    <div class="strength-meter-container">
                        <div class="strength-bar" id="password-strength-bar"></div>
                        <span class="strength-label" id="password-strength-label"></span>
                    </div>
                    <div class="error-feedback" id="password-error"></div>
                </div>
                <div class="input-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input 
                        type="password" 
                        id="confirm-password" 
                        name="confirm-password" 
                        placeholder="Repeat your password" 
                        required 
                        minlength="8"
                        autocomplete="new-password"
                        aria-describedby="confirm-password-error">
                    <div class="error-feedback" id="confirm-password-error"></div>
                </div>
                <button type="submit" class="btn-submit">Create Account</button>
            </form>
            
            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Log in here</a></p>
            </div>
        </div>
    </div>
    <script src="auth.js"></script>
</body>
</html>
